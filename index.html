<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iğdır</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- THREE.JS GAME -->
    <div id="game"></div>


    <!-- START SCREEN -->
    <div id="start">

        <div class="cinematic-top"></div>

        <div class="menu-content">

            <p class="eyebrow">
                DOĞU'NUN SINIRINDA
            </p>

            <h1>
                IĞDIR
            </h1>

            <div class="gold-line"></div>

            <p class="description">
                Ağrı Dağı'nın gölgesinde şehri keşfet.
            </p>

            <button id="play">
                ŞEHRE GİR
            </button>

            <p class="controls">
                WASD HAREKET • MOUSE BAKIŞ • SHIFT KOŞ • SPACE ZIPLA • N GECE/GÜNDÜZ
            </p>

        </div>


        <div class="location-card">

            <span>
                KONUM
            </span>

            <strong>
                IĞDIR / TÜRKİYE
            </strong>

        </div>

        <div class="cinematic-bottom"></div>

    </div>


    <!-- BLACK TRANSITION -->
    <div id="transition"></div>


    <!-- GAME SCRIPT -->
    <script type="module" src="./game.js"></script>

</body>

</html>
