<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iğdır</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="start">
    <div class="shade"></div>
    <div class="brand">
      <div class="eyebrow">DOĞU'NUN SINIRINDA</div>
      <h1>IĞDIR</h1>
      <div class="rule"></div>
      <p>Ağrı Dağı'nın gölgesinde şehri keşfet.</p>
      <button id="play">ŞEHRE GİR <b>→</b></button>
      <small>WASD HAREKET · MOUSE BAKIŞ · SHIFT KOŞ · SPACE ZIPLA · N GECE/GÜNDÜZ</small>
    </div>
    <div class="loc"><b>IĞDIR / TÜRKİYE</b><span>KONUM</span></div>
    <div class="bars"></div>
  </div>
  <div id="transition"><span>IĞDIR</span></div>
  <div id="hud"><span>IĞDIR</span><small>MERKEZ</small></div>
  <div id="crosshair"></div>
  <script type="module" src="./game.js"></script>
</body>
</html>
